services:
  - type: web
    name: taitech-market
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DB_FILE
        value: /var/data/taitech-market-db.json
    disk:
      name: taitech-market-data
      mountPath: /var/data
      sizeGB: 10
